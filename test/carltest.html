<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#05080c;overflow:hidden}#c{position:fixed;inset:0}
#lbl{position:fixed;left:10px;top:8px;color:#8fd;font:13px monospace;z-index:9;text-shadow:0 0 6px #000}</style></head>
<body><div id="c"></div><div id="lbl"></div>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildCarl } from '../src/actors.js';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.92;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('c').appendChild(renderer.domElement);

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0c1a24);
// IBL like render.js (dim cool)
const room=new RoomEnvironment(); const GAIN=0.16, TINT=new THREE.Color(0x2b5a72);
room.traverse(o=>{const m=o.material;if(!m)return; if(m.isMeshBasicMaterial){m.color.multiplyScalar(GAIN);m.color.multiply(TINT).multiplyScalar(2);} else if(m.isMeshStandardMaterial){m.color.lerp(TINT,.5).multiplyScalar(.5);}});
room.traverse(o=>{if(o.isPointLight){o.intensity*=GAIN;o.color.copy(TINT);}});
const pmrem=new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
scene.environment=pmrem.fromScene(room,0.04).texture;
// scene lights matching env.js
scene.add(new THREE.HemisphereLight(0x2f6f92,0x0a1620,0.45));
const key=new THREE.DirectionalLight(0xdcecff,1.35); key.position.set(14,24,10); key.castShadow=true;
key.shadow.mapSize.set(1024,1024); key.shadow.camera.top=8;key.shadow.camera.bottom=-2;key.shadow.camera.left=-6;key.shadow.camera.right=6; scene.add(key);
const rim=new THREE.DirectionalLight(0xffb27a,0.4); rim.position.set(-12,9,-14); scene.add(rim);
const bnc=new THREE.DirectionalLight(0x3d84b0,0.22); bnc.position.set(-4,6,12); scene.add(bnc);
scene.add(new THREE.AmbientLight(0x0e2430,0.28));

const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0x23323f,roughness:.95,metalness:.1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const carl=buildCarl(); scene.add(carl);

// game-like iso framing but tighter on Carl
const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
const OFF=new THREE.Vector3(4.2,5.6,4.2);
function place(){ cam.position.copy(OFF); cam.lookAt(0,1.3,0); }
place();

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.6,0.5,0.8));
composer.addPass(new OutputPass());

// state driver: cycle idle -> move -> idle -> attack, expose manual override
let forced=null; window.__setState=s=>forced=s;
window.__axe=(rx,ry,rz,px,py,pz,sc)=>{ const a=carl.userData.axe; if(!a)return false;
  a.rotation.set(rx,ry,rz); a.position.set(px,py,pz); a.scale.setScalar(sc); return true; };
window.__attack=()=>carl.userData.attack&&carl.userData.attack();
window.__spin=a=>{carl.rotation.y=a;};
window.__READY=true;
const clock=new THREE.Clock(); let tt=0, lastAtk=0;
const lbl=document.getElementById('lbl');
function loop(){
  const dt=Math.min(.05,clock.getDelta()); tt+=dt;
  // auto cycle if not forced: 0-3s idle, 3-7s move(run), 7-11 idle w/ attacks
  let state=forced;
  if(!state){ const c=tt%12; state=c<3?'idle':(c<7?'move':'idle'); if(c>=7 && tt-lastAtk>1.2){carl.userData.attack&&carl.userData.attack(); lastAtk=tt;} }
  carl.userData.update&&carl.userData.update(dt,state);
  // slow turntable so we see all sides across shots (freezable for tuning)
  if(window.__frz!==undefined) carl.rotation.y=window.__frz;
  else carl.rotation.y=Math.sin(tt*0.35)*0.9;
  lbl.textContent='state='+state+'  t='+tt.toFixed(1)+'  children='+carl.children.length;
  composer.render(); requestAnimationFrame(loop);
}
loop();
</script></body></html>
